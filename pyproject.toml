[project]
name = "battery-sim"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "openelectricity[analysis]",
    "pandas",
    "numpy",
    "scipy",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/battery_sim"]
