[project]
name = "battery-sim"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "openelectricity[analysis]",
    "pandas",
    "numpy",
    "scipy",
    "python-dotenv",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "ipykernel>=7.2.0",
    "pip>=26.0.1",
    "torch>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/battery_sim"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
